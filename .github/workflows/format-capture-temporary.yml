name: Temporary Prettier capture
on:
  push:
    branches:
      - feat/phase1-audit-webhooks
permissions:
  contents: read
jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npx prettier --write src/pages/settings.tsx
        working-directory: frontend
      - name: Print formatted source for maintainers
        run: |
          echo BEGIN_VELORAY_FORMAT_B64
          base64 -w96 frontend/src/pages/settings.tsx
          echo END_VELORAY_FORMAT_B64
