name: Temporary UI format capture
on:
  push:
    branches:
      - fix/quality-ui-github-autoupdate
permissions:
  contents: read
jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - name: Capture Prettier output
        run: |
          npx prettier --write src/pages/settings.tsx src/components/common/floating-menu.tsx src/components/layout/sidebar.tsx src/styles.css
          for file in src/pages/settings.tsx src/components/common/floating-menu.tsx src/components/layout/sidebar.tsx src/styles.css; do
            echo "BEGIN_FORMATTED:$file"
            base64 -w96 "$file"
            echo "END_FORMATTED:$file"
          done
        working-directory: frontend
