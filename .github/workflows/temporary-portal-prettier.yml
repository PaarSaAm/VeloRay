name: Temporary Portal Formatting
on:
  push:
    branches: [feat/pasarguard-style-portal-parity]
permissions:
  contents: read
jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - name: Capture formatter output
        working-directory: frontend
        run: |
          npx prettier --write src/pages/settings.tsx src/lib/api.ts src/lib/fa.ts
          for file in src/pages/settings.tsx src/lib/api.ts src/lib/fa.ts; do
            echo "BEGIN_FORMATTED:$file"
            base64 -w96 "$file"
            echo "END_FORMATTED:$file"
          done
